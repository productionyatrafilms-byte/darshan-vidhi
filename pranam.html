<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-lang-key="pranam"></title>

    <link
      rel="stylesheet"
      href="./fontawesome/css/all.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />

    <style>
      body {
        background-image: url("./assets/images/pranam-bg.png");
      }
        .pranam-video{
    position: absolute;
    left: 50%;
    top: 48.7%;
       background-image: url("./assets/images/pranam-bg-1.png");
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    transform: translate(-50%, -50%);
    width: 28vw;
    height: 28vw;
    border-radius: 50%;
    background-color: #f6f6f6;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    padding-right: 2.5vw;
  }

.pranam-video video {
    width: 90%;
    height: 83%;
    object-fit: cover;

    /* Very light feather on ALL edges */
    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(0, 0, 0, 0.8) 2%,
            rgba(0, 0, 0, 0.95) 4%,
            black 6%,
            black 90%,
            rgba(0, 0, 0, 0.95) 96%,
            rgba(0, 0, 0, 0.8) 98%,
            transparent 100%
        ),
        linear-gradient(
            to right,
            transparent 0%,
            rgba(0, 0, 0, 0.8) 2%,
            rgba(0, 0, 0, 0.95) 4%,
            black 6%,
            black 90%,
            rgba(0, 0, 0, 0.95) 96%,
            rgba(0, 0, 0, 0.8) 98%,
            transparent 100%
        );

    -webkit-mask-composite: source-in;

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(0, 0, 0, 0.8) 2%,
            rgba(0, 0, 0, 0.95) 4%,
            black 6%,
            black 90%,
            rgba(0, 0, 0, 0.95) 96%,
            rgba(0, 0, 0, 0.8) 98%,
            transparent 100%
        ),
        linear-gradient(
            to right,
            transparent 0%,
            rgba(0, 0, 0, 0.8) 2%,
            rgba(0, 0, 0, 0.95) 4%,
            black 6%,
            black 90%,
            rgba(0, 0, 0, 0.95) 96%,
            rgba(0, 0, 0, 0.8) 98%,
            transparent 100%
        );

    mask-composite: intersect;

    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;

    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
}

    </style>
  </head>

  <body>
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="language-container">
      <div class="english active">E</div>
      <div class="hindi">H</div>
      <div class="gujrati">G</div>
    </div>

    <div class="pranam-container">
      <div class="pranam-img">
        <div class="pranam-video">
          <video src="./assets/videos/pranam.mp4" autoplay muted></video>
        </div>

        <span data-lang-key="pranam"></span>
        <img src="./assets/images/pranam-img.png" alt="Pranam" />
      </div>

      <a href="index.html" class="home-btn-1">
        <span data-lang-key="home"></span>
        <img src="./assets/images/home-btn-1.png" alt="Home" />
      </a>
    </div>

    <!-- Page-load audio -->
    <audio id="pranamAudio" preload="auto">
      <source src="./assets/audio/pranam.mp3" type="audio/mpeg" />
    </audio>

    <!-- Back-button audio -->
    <audio id="popAudio" preload="auto">
      <source src="./assets/audio/pop.mp3" type="audio/mpeg" />
    </audio>

    <!-- Home-button audio -->
    <audio id="topicAudio" preload="auto">
      <source src="./assets/audio/topic.mp3" type="audio/mpeg" />
    </audio>
    <script src="./assets/js/data.js"></script>

    <script src="./assets/js/app.js"></script>
     <script src="./assets/js/djp.js"></script>
    <script>
      window.addEventListener("load", () => {
        const pranamAudio = document.getElementById("pranamAudio");
        const popAudio = document.getElementById("popAudio");
        const topicAudio = document.getElementById("topicAudio");

        const backButton = document.querySelector(".back-btn");
        const homeButton = document.querySelector(".home-btn-1");

        // Play pranam.mp3 only when the page loads
        if (pranamAudio) {
          pranamAudio.currentTime = 0;

          pranamAudio.play().catch((error) => {
            console.warn("Pranam audio autoplay was prevented:", error);
          });
        }

        // Play pop.mp3 when the Back button is clicked
        backButton?.addEventListener("click", (event) => {
          event.preventDefault();

          const destination = backButton.href;

          if (pranamAudio) {
            pranamAudio.pause();
            pranamAudio.currentTime = 0;
          }

          if (!popAudio) {
            window.location.href = destination;
            return;
          }

          popAudio.currentTime = 0;
          popAudio.play().catch(() => {});

          // Small delay so the click sound can be heard
          setTimeout(() => {
            window.location.href = destination;
          }, 400);
        });

        // Play topic.mp3 when the Home button is clicked
        homeButton?.addEventListener("click", (event) => {
          event.preventDefault();

          const destination = homeButton.href;

          if (pranamAudio) {
            pranamAudio.pause();
            pranamAudio.currentTime = 0;
          }

          if (!topicAudio) {
            window.location.href = destination;
            return;
          }

          topicAudio.currentTime = 0;
          topicAudio.play().catch(() => {});

          // Small delay so the click sound can be heard
          setTimeout(() => {
            window.location.href = destination;
          }, 400);
        });
      });
    </script>
  </body>
</html>
